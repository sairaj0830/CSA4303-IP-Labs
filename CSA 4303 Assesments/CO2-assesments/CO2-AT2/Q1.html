<!DOCTYPE html>
<html>
<head>
<title>Responsive Navbar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

nav {
    background: #222;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.menu {
    display: flex;
    gap: 25px;
    list-style: none;
}

.menu a {
    color: white;
    text-decoration: none;
}

.menu a:hover {
    color: orange;
}

.hamburger {
    display: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

@media (max-width: 600px) {

    .hamburger {
        display: block;
    }

    .menu {
        display: none;
        flex-direction: column;
        background: #222;
        width: 100%;
        padding: 20px;
    }

    .menu.active {
        display: flex;
    }

    nav {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">ShopEasy</div>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <ul class="menu" id="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Cart</a></li>
        <li><a href="#">Login</a></li>
    </ul>
</nav>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
