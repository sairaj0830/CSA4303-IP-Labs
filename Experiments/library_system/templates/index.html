<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">📚 Nexus Library</h1>
            <div id="user-controls" class="hidden">
                <span id="role-badge" class="px-3 py-1 bg-indigo-500 rounded-full text-sm mr-4"></span>
                <button onclick="logout()" class="hover:text-indigo-200 transition">Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 p-4">
        
        <!-- Login Section -->
        <div id="login-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md text-center mt-20">
            <h2 class="text-2xl font-semibold mb-6">Welcome Back</h2>
            <p class="text-slate-500 mb-8">Select your role to continue</p>
            <div class="flex flex-col gap-4">
                <button onclick="login('Student')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">Login as Student</button>
                <button onclick="login('Admin')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition">Login as Admin</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            
            <!-- Admin Controls -->
            <div id="admin-controls" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                <h3 class="text-xl font-semibold mb-4">Add New Material</h3>
                <form id="add-book-form" class="flex gap-4">
                    <input type="text" id="title" placeholder="Book Title" class="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    <input type="text" id="author" placeholder="Author" class="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    <input type="number" id="year" placeholder="Year" class="w-24 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    <input type="number" id="sem" placeholder="Sem" class="w-24 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition">Add</button>
                </form>
            </div>

            <!-- Search and Catalog -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-semibold">Library Catalog</h3>
                    <input type="text" id="search" placeholder="Search books..." class="p-2 border rounded-lg w-64 focus:ring-2 focus:ring-indigo-500 outline-none" onkeyup="filterBooks()">
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 border-b">
                                <th class="p-4 font-medium">Title</th>
                                <th class="p-4 font-medium">Author</th>
                                <th class="p-4 font-medium">Year/Sem</th>
                                <th class="p-4 font-medium">Status</th>
                                <th class="p-4 font-medium text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="books-list" class="divide-y divide-slate-100">
                            <!-- Books injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserRole = null;
        let allBooks = [];

        // UI State Management
        function login(role) {
            currentUserRole = role;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-controls').classList.remove('hidden');
            document.getElementById('role-badge').innerText = role;
            
            if (role === 'Admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
            } else {
                document.getElementById('admin-controls').classList.add('hidden');
            }
            fetchBooks();
        }

        function logout() {
            currentUserRole = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-controls').classList.add('hidden');
        }

        // API Calls
        async function fetchBooks() {
            const response = await fetch('/api/books');
            allBooks = await response.json();
            renderBooks(allBooks);
        }

        async function borrowBook(id) {
            const response = await fetch('/api/borrow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });
            const result = await response.json();
            alert(result.message || result.error);
            fetchBooks(); // Refresh UI
        }

        // Add Book Form Handler
        document.getElementById('add-book-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                year: document.getElementById('year').value,
                sem: document.getElementById('sem').value
            };

            await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            });
            
            e.target.reset();
            fetchBooks();
        });

        // Search Filter
        function filterBooks() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = allBooks.filter(b => 
                b.title.toLowerCase().includes(term) || 
                b.author.toLowerCase().includes(term)
            );
            renderBooks(filtered);
        }

        // Render Table
        function renderBooks(books) {
            const tbody = document.getElementById('books-list');
            tbody.innerHTML = '';
            
            books.forEach(book => {
                const statusColor = book.available ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50';
                const statusText = book.available ? 'Available' : 'Issued';
                
                // Show borrow button only for students and if available
                let actionBtn = '-';
                if (currentUserRole === 'Student' && book.available) {
                    actionBtn = `<button onclick="borrowBook(${book.id})" class="text-sm bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1 rounded-md font-medium transition">Borrow</button>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-medium text-slate-800">${book.title}</td>
                        <td class="p-4 text-slate-600">${book.author}</td>
                        <td class="p-4 text-slate-600">Yr ${book.year} / Sem ${book.sem}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-md text-xs font-semibold ${statusColor}">${statusText}</span>
                        </td>
                        <td class="p-4 text-right">${actionBtn}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
