<!DOCTYPE html>
<html><head><meta charset='UTF-8'><title>💻 Electronics E-Commerce Website</title>
<link rel='stylesheet' href='style.css'></head>
<body>
<div class='card'>
<h1>💻 Electronics E-Commerce Website</h1>
<div class='form'>
<input id='name' placeholder='Product Name'>
<select id='type'><option>Laptop</option><option>Mobile</option><option>Headphones</option><option>Smart Watch</option></select>
<button onclick='addItem()'>Add to Cart</button>
</div>
<input id='search' placeholder='Search...' onkeyup='searchItem()'>
<table>
<thead><tr><th>Product Name</th><th>Category</th><th>Status</th><th>Action</th></tr></thead>
<tbody id='tbl'></tbody>
</table>
</div>
<script src='script.js'></script>
</body></html>
